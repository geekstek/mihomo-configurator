<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mihomo Configurator</title>
    <style>
      #file-entry {
        display: none;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 32px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      #file-entry.visible {
        display: grid;
        place-items: center;
      }

      #file-entry section {
        width: min(640px, 100%);
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 16px 40px rgb(37 55 83 / 10%);
      }

      #file-entry h1 {
        margin: 0 0 10px;
        font-size: 24px;
        letter-spacing: 0;
      }

      #file-entry p {
        margin: 0 0 16px;
        color: #5d6b82;
        line-height: 1.65;
      }

      #file-entry a {
        min-height: 40px;
        border-radius: 8px;
        background: #0f8b8d;
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        font-weight: 700;
        text-decoration: none;
      }

      #file-entry code {
        border-radius: 6px;
        background: #edf2f7;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <div id="file-entry">
      <section>
        <h1>Mihomo Configurator</h1>
        <p>
          根目录的 <code>index.html</code> 是开发入口，直接用 file:// 打开时浏览器不会编译
          React / TypeScript。请打开构建后的静态版本，或使用本地开发服务。
        </p>
        <p>
          <a href="./dist/index.html">打开本地静态版本</a>
        </p>
      </section>
    </div>
    <div id="root"></div>
    <script type="module">
      const isBuiltFile =
        window.location.protocol === 'file:' &&
        /\/dist\/(?:index\.html)?$/.test(window.location.pathname);
      const isFileEntry = window.location.protocol === 'file:' && !isBuiltFile;

      if (isFileEntry) {
        document.getElementById('file-entry')?.classList.add('visible');
      } else {
        import('/src/main.tsx');
      }
    </script>
  </body>
</html>
